<a class="skip-link" href="#main">{{ 'app.skip' | t }}</a>

<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
    aria-label="Main navigation"
  >
    <div class="brand">
      <mat-icon aria-hidden="true">account_balance_wallet</mat-icon>
      <span>Walletix</span>
    </div>
    <mat-nav-list>
      @for (link of links; track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label | t }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" [attr.aria-label]="'app.menu' | t"
                [attr.aria-expanded]="drawer.opened">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      <app-language-menu />
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button"
              [attr.aria-label]="auth.user()?.nombreUsuario ?? ''">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        <span class="user-name">{{ auth.user()?.nombreUsuario }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/profile">
          <mat-icon aria-hidden="true">person</mat-icon>{{ 'nav.profile' | t }}
        </a>
        <button mat-menu-item (click)="auth.logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>{{ 'app.logout' | t }}
        </button>
      </mat-menu>
    </mat-toolbar>

    <main id="main" class="main" tabindex="-1">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <span>© {{ year }} {{ 'app.rights' | t }}</span>
      <a routerLink="/terms">{{ 'app.terms' | t }}</a>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
