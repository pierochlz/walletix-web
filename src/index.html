<!doctype html>
<html lang="es-419">
  <head>
    <meta charset="utf-8" />
    <title>Walletix</title>
    <meta name="description" content="Walletix: personal finance web app" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
  <script>
    // US37: saved theme before the app loads (see ThemeService)
    try {
      var theme = localStorage.getItem('walletix_theme');
      if (theme === 'dark' || theme === 'auto') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
    <app-root></app-root>
  </body>
</html>
