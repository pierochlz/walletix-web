# Render's free plan puts the API to sleep after ~15 minutes without requests,
# and waking it up takes 30-60 seconds (the first login looks "stuck").
# This job calls GET /health every 10 minutes so the API stays awake.
# GitHub only runs scheduled workflows from the default branch (main).
#
# ON for the presentation week. Render's free plan gives 750 hours per month and this account has
# only this service: even awake 24 hours a day it uses at most 744 hours in a month of 31 days.
# The repository is public, so GitHub does not limit the minutes of these runs.
# To turn it off, put a "#" in front of the two "schedule" lines below and push to main.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (UTC); GitHub may delay it a few minutes
  workflow_dispatch: # can also be run by hand from the Actions tab (wakes the API once)

permissions: {} # it only makes an HTTP request, it does not need access to the repository

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /health
        # --retry: if the API was asleep, the first try can fail while it starts
        run: |
          curl --silent --show-error --fail --max-time 90 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               https://walletix-jbsb.onrender.com/health
